<nav class="text-white p-4 flex justify-between items-center fixed w-full top-0 shadow-lg z-50"
     [attr.aria-label]="i18n.ui.header.mainNavigation">
  <!-- Logo / Home Link -->
  <a class="text-xl font-bold flex items-center" routerLink="/" (click)="closeMenu()">
    <i class="fas fa-home mr-2" aria-hidden="true"></i> Priyanka Giri
  </a>

  <div class="flex items-center gap-3">
    <!-- Navbar Links (Responsive) -->
    <div id="nav-links"
         [class.hidden]="!menuOpen" [class.block]="menuOpen"
         class="lg:flex absolute lg:static top-16 left-0 w-full lg:w-auto bg-black lg:bg-transparent lg:space-x-2 xl:space-x-4 p-4 lg:p-0">
      @for (link of links; track link.path) {
        <a class="flex items-center px-3 py-2 hover:text-gray-400"
           [routerLink]="link.path" routerLinkActive="text-cyan-300" (click)="closeMenu()">
          <i class="fas {{ link.icon }} mr-2 lg:hidden xl:inline-block" aria-hidden="true"></i> {{ i18n.ui.nav[link.key] }}
        </a>
      }
    </div>

    <!-- Language switch -->
    <div class="flex rounded-full border border-white/30 overflow-hidden text-sm" role="group"
         [attr.aria-label]="i18n.ui.header.language">
      @for (language of languages; track language.code) {
        <button type="button" class="px-3 py-1 transition"
                [class.bg-cyan-300]="i18n.lang() === language.code"
                [class.text-black]="i18n.lang() === language.code"
                [class.font-semibold]="i18n.lang() === language.code"
                [attr.aria-pressed]="i18n.lang() === language.code"
                [attr.lang]="language.code"
                (click)="i18n.set(language.code)">{{ language.label }}</button>
      }
    </div>

    <!-- Mobile Menu Button -->
    <button type="button" (click)="toggleMenu()" class="lg:hidden text-white text-2xl"
            [attr.aria-label]="i18n.ui.header.menuToggle" aria-controls="nav-links" [attr.aria-expanded]="menuOpen">
      <i class="fas fa-bars" aria-hidden="true"></i>
    </button>
  </div>
</nav>
