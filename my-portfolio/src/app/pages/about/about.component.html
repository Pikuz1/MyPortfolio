<section class="glass-section animate-fadeIn">
  <div class="grid grid-cols-1 xl:grid-cols-12 gap-8 items-start">

    <!-- Photo, name and resume -->
    <div class="xl:col-span-3 flex flex-col md:flex-row xl:flex-col items-center justify-center gap-4 md:gap-8 xl:gap-4
                text-center md:text-left xl:text-center">
      <img [src]="about.photo" [alt]="about.name" appTilt [tiltMax]="12"
           width="224" height="224" fetchpriority="high"
           class="w-44 h-44 md:w-56 md:h-56 xl:w-48 xl:h-48 rounded-full object-cover flex-shrink-0
                  border-4 border-[rgba(100,255,218,0.35)]
                  shadow-[0_0_40px_rgba(100,255,218,0.25)]
                  brightness-90 transition-transform duration-300">
      <div>
        <h1 class="text-4xl font-bold mb-3">{{ about.name }}</h1>
        <h2 class="text-2xl font-semibold">{{ about.role }}</h2>
        <a class="inline-block mt-5 px-6 py-3 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition"
           href="{{ about.resumeLink }}" download>{{ i18n.ui.about.downloadResume }}</a>
      </div>
    </div>

    <div class="about-text xl:col-span-5">
      <p *ngFor="let paragraph of about.description" class="text-lg mb-4" [innerHTML]="paragraph"></p>

      <h3 class="text-sm uppercase tracking-wide text-gray-400 mt-6 mb-2">{{ i18n.ui.about.toolsTitle }}</h3>
      <ul class="flex flex-wrap gap-2">
        <li *ngFor="let tool of about.tools"
            class="px-3 py-1 rounded-full text-sm border border-[rgba(100,255,218,0.3)] bg-[rgba(100,255,218,0.08)] text-cyan-100">
          {{ tool }}
        </li>
      </ul>
    </div>

    <div class="xl:col-span-4">
      <h2 class="text-2xl font-semibold text-center mb-4">{{ i18n.ui.about.workingWithMe }}</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-1 gap-4">
        <div *ngFor="let item of about.howIWork"
             class="p-5 rounded-xl
                    bg-[rgba(10,25,47,0.2)] backdrop-blur-md
                    border border-[rgba(100,255,218,0.1)]
                    shadow-md transition-all duration-300
                    hover:-translate-y-1 hover:border-[rgba(100,255,218,0.3)]">
          <h3 class="text-lg font-semibold mb-1">{{ item.title }}</h3>
          <p class="text-sm text-gray-300">{{ item.text }}</p>
        </div>
      </div>
    </div>

  </div>
</section>
