<section class="glass-section glass-section--medium text-white">
  <h1 class="text-3xl font-bold text-center mb-8">{{ i18n.ui.education.title }}</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
  <div *ngFor="let edu of education"
       class="p-5 rounded-xl
              bg-[rgba(10,25,47,0.2)] backdrop-blur-md
              border border-[rgba(100,255,218,0.1)]
              shadow-lg transition-all duration-300
              hover:shadow-xl hover:border-[rgba(100,255,218,0.25)]">

    <h2 class="text-xl font-semibold">
      {{ edu.school }}
    </h2>

    <p class="text-sm text-gray-300 mt-1">
      {{ edu.degree }} ({{ edu.year }})
    </p>

  </div>
  </div>

  <h2 class="text-2xl font-semibold text-center mt-8 mb-4">{{ i18n.ui.education.languages }}</h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
  <div *ngFor="let lang of languages"
       class="p-4 rounded-xl
              bg-[rgba(10,25,47,0.2)] backdrop-blur-md
              border border-[rgba(100,255,218,0.1)]">
    <span class="font-semibold">{{ lang.name }}</span>
    <span class="text-sm text-gray-300"> : {{ lang.level }}</span>
  </div>
  </div>
</section>
