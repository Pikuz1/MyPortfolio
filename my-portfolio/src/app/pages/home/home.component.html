<section class="p-4 md:p-6 text-center text-white">
  <h1 class="font-bold mb-3 text-[clamp(1.6rem,6vw,3rem)] leading-tight">{{ i18n.ui.home.title }}</h1>
  <p class="mb-4 md:mb-6 text-[clamp(0.9rem,2.6vw,1.125rem)]">
    {{ i18n.ui.home.tagline }}
  </p>

  <!-- The picture shrinks with the window height, so the page fits short screens too -->
  <div class="flex justify-center">
    <img src="assets/my-sticker.webp"
         alt="Priyanka Giri"
         width="224" height="224" fetchpriority="high"
         class="w-[clamp(7rem,28dvh,14rem)] h-[clamp(7rem,28dvh,14rem)] rounded-full shadow-lg object-cover border-4 border-gray-300">
  </div>
</section>
