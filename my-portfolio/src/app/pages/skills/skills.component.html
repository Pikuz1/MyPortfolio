<div class="skills-container">
  <div class="header">
    <h2>{{ i18n.ui.skills.title }}</h2>
    <p>{{ i18n.ui.skills.subtitle }}</p>
  </div>

  <div class="content">
    <div class="stage">
      <div class="canvas-container" #canvasContainer></div>

      <div class="skill-details" *ngIf="selectedSkill" aria-live="polite">
        <span class="category-tag" [style.color]="categoryColor(selectedSkill.category)"
              [style.border-color]="categoryColor(selectedSkill.category)">
          {{ categoryName(selectedSkill.category) }}
        </span>
        <h3>{{ selectedSkill.name }}</h3>
        <p>{{ describe(selectedSkill) }}</p>
      </div>

      <p class="instructions">{{ i18n.ui.skills.hint }}</p>
    </div>

    <aside class="sidebar">
    <div class="category-selector">
      <button
        *ngFor="let category of skillCategories"
        type="button"
        (click)="selectCategory(category.id)"
        [class.active]="selectedCategory === category.id"
        [attr.aria-pressed]="selectedCategory === category.id"
        class="category-btn">
        <span class="dot" *ngIf="categoryColor(category.id) as color" [style.background]="color"></span>
        {{ category.name }}
      </button>
    </div>

    <button
      type="button"
      (click)="toggleConnections()"
      [class.active]="showConnections"
      [attr.aria-pressed]="showConnections"
      class="connections-btn">
      {{ showConnections ? i18n.ui.skills.hideConnections : i18n.ui.skills.showConnections }}
    </button>
    </aside>
  </div>
</div>
